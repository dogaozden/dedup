[package]
name = "dedup-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
rayon = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
